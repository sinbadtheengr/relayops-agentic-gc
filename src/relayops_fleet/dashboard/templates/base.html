<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}RelayOps approvals{% endblock %}</title>
  <style>
    :root { --ink:#12161c; --muted:#5b6470; --line:#e2e6eb; --bg:#f7f8fa;
            --warn:#8a4b00; --warnbg:#fff4e2; --ok:#12602f; }
    * { box-sizing:border-box }
    body { margin:0; font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;
           color:var(--ink); background:var(--bg) }
    header { background:#fff; border-bottom:1px solid var(--line); padding:14px 22px }
    header a { color:inherit; text-decoration:none; font-weight:600 }
    main { max-width:1040px; margin:22px auto; padding:0 22px }
    h1 { font-size:20px; margin:0 0 4px }
    .sub { color:var(--muted); margin:0 0 20px }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px;
            padding:16px; margin-bottom:14px }
    .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap }
    .tab { padding:6px 12px; border:1px solid var(--line); border-radius:99px;
           background:#fff; color:var(--muted); text-decoration:none; font-size:13px }
    .tab.on { background:var(--ink); color:#fff; border-color:var(--ink) }
    .badge { display:inline-block; background:var(--warnbg); color:var(--warn);
             border:1px solid #f0d4a8; border-radius:4px; padding:1px 7px;
             font-size:12px; font-weight:600 }
    .meta { color:var(--muted); font-size:13px }
    pre { white-space:pre-wrap; word-wrap:break-word; background:var(--bg);
          border:1px solid var(--line); border-radius:6px; padding:10px; margin:8px 0 0 }
    form { display:inline }
    button { font:inherit; padding:6px 12px; border-radius:6px; cursor:pointer;
             border:1px solid var(--line); background:#fff }
    button.primary { background:var(--ink); color:#fff; border-color:var(--ink) }
    table { width:100%; border-collapse:collapse; font-size:14px }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line) }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase }
    .note { background:#fff; border-left:3px solid var(--ink); padding:10px 14px;
            margin-bottom:18px; font-size:13px; color:var(--muted) }
  </style>
</head>
<body>
  <header><a href="/">RelayOps — approvals</a></header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
