<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" width="1180" height="820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3341f"/>
    </marker>
  </defs>

  <rect width="1180" height="820" fill="#f7f8fa"/>
  <text x="40" y="48" font-size="25" font-weight="700" fill="#12161c">RelayOps Revenue Recovery Fleet</text>
  <text x="40" y="74" font-size="14" fill="#5b6470">Multi-tenant background agent fleet · Google Cloud · one Pub/Sub message per lapsed client</text>

  <!-- GCP boundary -->
  <rect x="30" y="96" width="1120" height="600" rx="12" fill="#ffffff" stroke="#d4dae1" stroke-dasharray="5 4"/>
  <text x="46" y="118" font-size="11" font-weight="700" fill="#8a94a1" letter-spacing="1">GOOGLE CLOUD · project relayops-fleet</text>

  <!-- Scheduler -->
  <rect x="56" y="138" width="196" height="62" rx="8" fill="#eef3fb" stroke="#c3d3ea"/>
  <text x="70" y="163" font-size="13" font-weight="700" fill="#12161c">Cloud Scheduler</text>
  <text x="70" y="182" font-size="11.5" fill="#5b6470">nightly · 09:00 Toronto</text>

  <!-- Publisher -->
  <rect x="56" y="232" width="196" height="78" rx="8" fill="#eef3fb" stroke="#c3d3ea"/>
  <text x="70" y="257" font-size="13" font-weight="700" fill="#12161c">Cloud Run Job</text>
  <text x="70" y="276" font-size="11.5" fill="#5b6470">publisher — fan-out</text>
  <text x="70" y="293" font-size="11.5" fill="#5b6470">caps spend, reports skips</text>

  <!-- Pub/Sub -->
  <rect x="56" y="342" width="196" height="78" rx="8" fill="#eef3fb" stroke="#c3d3ea"/>
  <text x="70" y="367" font-size="13" font-weight="700" fill="#12161c">Pub/Sub</text>
  <text x="70" y="386" font-size="11.5" fill="#5b6470">one message per client</text>
  <text x="70" y="403" font-size="11.5" fill="#5b6470">at-least-once delivery</text>

  <!-- DLQ -->
  <rect x="56" y="452" width="196" height="56" rx="8" fill="#fdf0ec" stroke="#e8c3b8"/>
  <text x="70" y="476" font-size="12.5" font-weight="700" fill="#a3341f">Dead-letter topic</text>
  <text x="70" y="494" font-size="11.5" fill="#8a5647">poison msgs, never retried</text>

  <!-- Worker -->
  <rect x="316" y="138" width="486" height="370" rx="10" fill="#ffffff" stroke="#b9c2cd" stroke-width="1.5"/>
  <text x="334" y="164" font-size="14" font-weight="700" fill="#12161c">Cloud Run service — worker</text>
  <text x="334" y="182" font-size="11.5" fill="#5b6470">one client per message · 204 ack / 500 retry</text>

  <!-- gates -->
  <rect x="334" y="198" width="450" height="66" rx="8" fill="#f0f7f2" stroke="#bcd9c6"/>
  <text x="348" y="221" font-size="12.5" font-weight="700" fill="#12602f">1 · Compliance gates — PURE PYTHON, NO MODEL</text>
  <text x="348" y="240" font-size="11.5" fill="#3d6b4d">opt-out (global) · suppression · cooldown (per clinic) · E.164</text>
  <text x="348" y="256" font-size="11.5" fill="#3d6b4d">a gated client stops here and costs 0 tokens</text>

  <!-- features -->
  <rect x="334" y="276" width="450" height="52" rx="8" fill="#f0f7f2" stroke="#bcd9c6"/>
  <text x="348" y="298" font-size="12.5" font-weight="700" fill="#12602f">2 · Features — PURE PYTHON</text>
  <text x="348" y="316" font-size="11.5" fill="#3d6b4d">lapse buckets · VIP = 80th percentile within the clinic</text>

  <!-- segment -->
  <rect x="334" y="340" width="450" height="52" rx="8" fill="#eef3fb" stroke="#c3d3ea"/>
  <text x="348" y="362" font-size="12.5" font-weight="700" fill="#1a4d8f">3 · Segment agent — ADK + Gemini</text>
  <text x="348" y="380" font-size="11.5" fill="#42607f">target? · priority tier · which approved offer</text>

  <!-- outreach -->
  <rect x="334" y="404" width="450" height="52" rx="8" fill="#eef3fb" stroke="#c3d3ea"/>
  <text x="348" y="426" font-size="12.5" font-weight="700" fill="#1a4d8f">4 · Outreach agent — ADK + Gemini</text>
  <text x="348" y="444" font-size="11.5" fill="#42607f">adapts approved template into SMS + email</text>

  <!-- casl -->
  <rect x="334" y="468" width="450" height="26" rx="6" fill="#f0f7f2" stroke="#bcd9c6"/>
  <text x="348" y="486" font-size="11.5" font-weight="700" fill="#12602f">5 · CASL guards — PURE PYTHON · STOP line, unsubscribe, VIP no-discount</text>

  <!-- Vertex -->
  <rect x="852" y="276" width="264" height="116" rx="8" fill="#eef3fb" stroke="#c3d3ea"/>
  <text x="870" y="302" font-size="13" font-weight="700" fill="#12161c">Vertex AI · global endpoint</text>
  <text x="870" y="323" font-size="11.5" fill="#5b6470">gemini-3.7-flash — segment</text>
  <text x="870" y="341" font-size="11.5" fill="#5b6470">gemini-3.5-flash — outreach</text>
  <text x="870" y="363" font-size="11" fill="#8a94a1">strict response_schema</text>
  <text x="870" y="379" font-size="11" fill="#8a94a1">(pydantic, extra=forbid)</text>

  <!-- Cloud SQL -->
  <rect x="316" y="546" width="486" height="118" rx="10" fill="#eef3fb" stroke="#c3d3ea"/>
  <text x="334" y="572" font-size="13.5" font-weight="700" fill="#12161c">Cloud SQL · Postgres 16</text>
  <text x="334" y="594" font-size="11.5" fill="#5b6470">clients · client_decisions · outreach_drafts · contact_log</text>
  <text x="334" y="612" font-size="11.5" fill="#5b6470">opt_outs (global) · outreach_outcomes (append-only)</text>
  <text x="334" y="634" font-size="11.5" font-weight="700" fill="#12602f">agent_decisions — every model call AND every refusal</text>
  <text x="334" y="652" font-size="11" fill="#8a94a1">runtime guard rejects any query without a clinic_id predicate</text>

  <!-- Dashboard -->
  <rect x="852" y="546" width="264" height="118" rx="10" fill="#fff8ec" stroke="#e6d2ad"/>
  <text x="870" y="572" font-size="13.5" font-weight="700" fill="#12161c">Cloud Run · dashboard</text>
  <text x="870" y="594" font-size="11.5" fill="#7a6224">the human gate</text>
  <text x="870" y="614" font-size="11.5" fill="#7a6224">approve · reject · mark sent</text>
  <text x="870" y="634" font-size="11.5" fill="#7a6224">why-this-draft · who-was-skipped</text>
  <text x="870" y="653" font-size="11" fill="#a08a4a">no aiplatform.user role</text>

  <!-- Operator -->
  <rect x="852" y="700" width="264" height="54" rx="8" fill="#ffffff" stroke="#b9c2cd"/>
  <text x="870" y="723" font-size="13" font-weight="700" fill="#12161c">Operator</text>
  <text x="870" y="742" font-size="11.5" fill="#5b6470">reads, approves, and sends by hand</text>

  <!-- arrows -->
  <line x1="154" y1="200" x2="154" y2="230" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="154" y1="310" x2="154" y2="340" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="154" y1="420" x2="154" y2="450" stroke="#a3341f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ared)"/>
  <line x1="252" y1="368" x2="314" y2="230" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="258" y="300" font-size="10.5" fill="#8a94a1">push</text>

  <line x1="786" y1="366" x2="850" y2="334" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="786" y1="430" x2="850" y2="352" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>

  <line x1="559" y1="508" x2="559" y2="544" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="802" y1="605" x2="850" y2="605" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="984" y1="664" x2="984" y2="698" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- forbidden set -->
  <rect x="30" y="712" width="792" height="82" rx="10" fill="#ffffff" stroke="#b9c2cd"/>
  <text x="48" y="737" font-size="13" font-weight="700" fill="#12161c">What the agents are forbidden to do</text>
  <text x="48" y="758" font-size="11.5" fill="#5b6470">· decide who may be contacted — consent is pure Python, and it runs first</text>
  <text x="48" y="775" font-size="11.5" fill="#5b6470">· do arithmetic — lapse buckets, VIP percentiles and billing are computed and handed over as facts</text>
  <text x="440" y="758" font-size="11.5" fill="#5b6470">· send anything — there is no send path in the repository</text>
  <text x="440" y="775" font-size="11.5" fill="#5b6470">· act unlogged — the agent_decisions write is mandatory</text>
</svg>
